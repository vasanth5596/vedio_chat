name: CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run app test (placeholder)
        run: echo "No tests configured"

      - name: Build Docker image
        run: |
          docker build -t vedio_chat .

      - name: Push Docker image (if configured)
        # Add Docker Hub/ECR push commands here
        run: echo "Skipping push step (configure Docker Hub for push)"

      - name: Deploy
        run: |
          bash deploy.sh