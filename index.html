<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Frontend</title>
<style>
  body { font-family: Arial, sans-serif; margin: 50px; }
  input, select { padding: 10px; margin: 5px; }
  button { padding: 10px 20px; }
  #result { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
<h1>Calculator Frontend</h1>
<label>First Number:</label>
<input type="number" id="num1" value="10"><br>
<label>Second Number:</label>
<input type="number" id="num2" value="5"><br>
<label>Operator:</label>
<select id="operator">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select><br>
<button onclick="calculate()">Calculate</button>
<div id="result"></div>
<script>
  function calculate() {
    const num1 = parseFloat(document.getElementById('num1').value);
    const num2 = parseFloat(document.getElementById('num2').value);
    const operator = document.getElementById('operator').value;
    let result;
    if (operator === '+') {
      result = num1 + num2;
    } else if (operator === '-') {
      result = num1 - num2;
    } else if (operator === '*') {
      result = num1 * num2;
    } else if (operator === '/') {
      if (num2 === 0) {
        document.getElementById('result').innerText = "Error: Division by zero";
        return;
      }
      result = num1 / num2;
    } else {
      document.getElementById('result').innerText = "Invalid operator";
      return;
    }
    document.getElementById('result').innerText = 'Result: ' + result;
  }
</script>
</body>
</html>
